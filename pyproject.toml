[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshort-local"
version = "0.1.0"
description = "Production locale de videos documentees, avec controles et reprises"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "langgraph>=0.3,<2", "httpx>=0.28,<1", "trafilatura>=2,<3",
  "Pillow>=11,<12", "numpy>=1.26,<3", "soundfile>=0.13,<1",
  "diffusers>=0.33,<1", "transformers>=4.51,<5", "accelerate>=1.6,<2",
  "safetensors>=0.5,<1", "huggingface-hub>=0.30,<1",
  "kokoro>=0.9.4,<1", "espeakng-loader==0.2.4", "phonemizer-fork>=3.3,<4",
  "faster-whisper>=1.1,<2", "filelock>=3.17,<4", "num2words>=0.5.14,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
autoshort = "autoshort.cli:main"
[tool.setuptools.packages.find]
include = ["autoshort*"]
[tool.setuptools.package-data]
autoshort = ["static/*"]
